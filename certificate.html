<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Print certificate | Annette Udoh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8962e;--ink:#1b1b1b;--serif:'Cormorant Garamond',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2a2a2a;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1rem;background:#0d0d0d;color:#f5f2ea;font-size:.9rem}
.bar button{background:#d4af37;border:0;border-radius:999px;padding:.6rem 1.4rem;font:inherit;font-weight:600;cursor:pointer}
.warn{color:#e6c964}
.pick{display:grid;gap:.6rem;max-width:520px;margin:2rem auto;padding:0 1rem}
.pick a{background:#fbf9f4;padding:.9rem 1.2rem;border-radius:8px;text-decoration:none;color:var(--ink)}
.sheet{padding:1rem .5rem;display:flex;justify-content:center}
.paper{width:297mm;height:210mm;flex:none;background:#fbf9f4;padding:9mm;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.frame{height:100%;border:1.6mm double var(--gold);padding:7mm 12mm;display:flex;flex-direction:column}
.head{text-align:center}
.logo{font-family:var(--serif);font-size:9mm;letter-spacing:.4mm}
.logo em{font-style:italic;color:var(--gold)}
h1{font-family:var(--serif);font-weight:500;font-size:12mm;line-height:1.1;margin-top:1mm}
.rule{width:40mm;height:.5mm;background:var(--gold);margin:3mm auto 0}
.mid{flex:1;min-height:0;display:grid;grid-template-columns:80mm 1fr;gap:12mm;align-items:center}
.photo{display:flex;justify-content:center;align-items:center}
.photo img{max-width:100%;max-height:76mm;object-fit:contain;border:.4mm solid #d9cfa9}
.stmt{font-family:var(--serif);font-size:5.4mm;line-height:1.3;margin-bottom:4mm}
dl,.fill{display:grid;grid-template-columns:32mm 1fr;gap:1.8mm 4mm;font-size:3.8mm}
dt{color:var(--gold);font-weight:600;align-self:center}
dd{font-family:var(--serif);font-size:5.2mm;line-height:1.2}
.fill{margin-top:5mm;align-items:end}
.fill i{display:block;border-bottom:.3mm solid var(--ink);height:6mm}
.fill b{font-weight:600;color:var(--gold);font-size:3.8mm}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10mm;margin-top:2mm}
.sig{flex:1;max-width:105mm}
.sig .line{border-bottom:.4mm solid var(--ink);height:16mm}
.sig span,.qr p{font-size:3.3mm;color:#555}
.qr{text-align:center;width:50mm}
.qr #qr{display:flex;justify-content:center;margin-bottom:1.5mm;min-height:28mm}
.qr small{display:block;word-break:break-all;font-size:2.3mm;color:#555}
.fine{text-align:center;font-size:2.9mm;color:#666;margin-top:3mm}
@page{size:A4 landscape;margin:0}
@media print{body{background:#fff}.bar,.noprint{display:none!important}.sheet{padding:0}.paper{box-shadow:none;zoom:1!important}}
</style>
</head>
<body>
<div class="bar noprint"><span id="msg"></span><button id="pb" onclick="print()" hidden>Print / Save as PDF</button></div>
<div id="root"></div>

<script src="artworks.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
const id = (q.get('id') || '').trim().toUpperCase();
const A = ARTWORKS[id];
const root = document.getElementById('root'), msg = document.getElementById('msg');
const unset = SITE_URL.indexOf('YOUR-SITE') > -1;

if (!A) {
  msg.textContent = id ? 'No entry for ' + id + '. Pick one below, or add it to artworks.js.' : 'Pick a certificate to print.';
  const keys = Object.keys(ARTWORKS);
  root.innerHTML = '<div class="pick">' + (keys.length ? keys.map(k => '<a href="certificate.html?id=' + encodeURIComponent(k) + '">' + esc(k) + ' &middot; ' + esc(ARTWORKS[k].title) + '</a>').join('') : '<a>No certificates yet. Add a piece to artworks.js.</a>') + '</div>';
} else {
  document.getElementById('pb').hidden = false;
  msg.innerHTML = 'Set paper to A4 landscape, margins none, background graphics on.' + (unset ? ' <span class="warn">Set SITE_URL in artworks.js first, or the QR points to the wrong address.</span>' : '');
  const url = baseUrl() + '/verify.html?id=' + encodeURIComponent(id);
  const rows = [['Title', A.title], ['Year', A.year], ['Medium', A.medium], ['Size', A.size], ['Edition', A.edition], ['Certificate No.', id]]
    .filter(r => r[1]).map(r => '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>').join('');
  const front = A.images && A.images[0] ? '<img src="' + esc(A.images[0][0]) + '" alt="' + esc(A.title) + '">' : '';
  root.innerHTML = '<div class="sheet"><div class="paper" id="paper"><div class="frame">' +
    '<div class="head"><div class="logo">Annette <em>Udoh</em></div><h1>Certificate of Authenticity</h1><div class="rule"></div></div>' +
    '<div class="mid"><div class="photo">' + front + '</div><div>' +
    '<p class="stmt">This certifies that the artwork described below is an authentic, original work created by ' + esc(ARTIST.name) + '.</p>' +
    '<dl>' + rows + '</dl>' +
    '<div class="fill"><b>Date of sale</b>' + (A.sold ? '<dd>' + esc(fmtDate(A.sold)) + '</dd>' : '<i></i>') + '<b>Issued to</b><i></i></div></div></div>' +
    '<div class="foot"><div class="sig"><div class="line"></div><span>Artist’s signature</span></div>' +
    '<div class="qr"><div id="qr"></div><p>Scan to verify this artwork<small>' + esc(url.replace(/^https?:\/\//, '')) + '</small></p></div></div>' +
    '<p class="fine">The buyer owns the physical artwork. Copyright and reproduction rights remain with ' + esc(ARTIST.name) + ' unless transferred in writing.</p>' +
    '</div></div></div>';
  try { new QRCode(document.getElementById('qr'), {text: url, width: 106, height: 106, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M}); }
  catch (e) { msg.textContent = 'The QR code needs an internet connection to draw. Reconnect and refresh.'; }
  const W = 297 / 25.4 * 96, fit = () => { document.getElementById('paper').style.zoom = Math.min(1, (innerWidth - 16) / W); };
  fit(); addEventListener('resize', fit);
}
</script>
</body>
</html>
